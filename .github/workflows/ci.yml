# Continuous integration for termbay (phase 1, tasks T3, T4 and the CI part of T5).
#
# Jobs:
#   test      lint and tests (Rust + UI) on macOS, Linux and Windows
#   e2e       end-to-end tests with tauri-driver on Linux and Windows (T9, F1-F3)
#   bundle    release build with the Tauri CLI, packages from decision D9,
#             size report in the job summary, fails above SIZE_LIMIT_MB
#   licenses  cargo-deny licenses, bans and sources, plus the npm license check
#   advisories  cargo-deny security advisories (separate check)
#
# Third-party actions are pinned to a full commit SHA (the tag is in the
# comment). Only actions with a permissive license are used:
#   actions/checkout (MIT), actions/setup-node (MIT), actions/cache (MIT),
#   EmbarkStudios/cargo-deny-action (Apache-2.0).
# The Rust toolchain comes from the rustup already installed on the runners.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Size limit per artifact, in MB (1 MB = 1,000,000 bytes). See scripts/check-size.sh.
  SIZE_LIMIT_MB: "20"

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies (Tauri 2, webkit2gtk-4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Shells for the autocomplete integration tests (core/tests/shell_integration.rs).
      # less and vi are used by the "Tab goes to full-screen programs" check.
      # Ubuntu 22.04 ships fish 3.3.1, the oldest fish termbay supports (no
      # `complete --escape` there; the script escapes the candidates itself).
      - name: Install zsh and fish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends zsh fish less vim-tiny

      # Ubuntu's /etc/zsh/zshrc runs compinit, and some function directories
      # on the runner are group writable, so compinit stops and asks whether
      # to "ignore insecure directories". Fix the permissions as a user would.
      - name: Secure zsh function directories (Linux)
        if: runner.os == 'Linux'
        # compaudit prints insecure directories on stdout (the header goes to
        # stderr) and exits 0 only when there are none.
        run: |
          insecure=$(zsh -fc 'autoload -Uz compaudit; compaudit' 2>/dev/null || true)
          if [ -n "$insecure" ]; then
            echo "$insecure"
            printf '%s\n' "$insecure" | xargs -d '\n' sudo chmod g-w,o-w
          fi
          zsh -fc 'autoload -Uz compaudit; compaudit'

      # zsh comes with macOS; fish 4 comes from Homebrew (about 30 s).
      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: brew install fish

      - name: Shell versions
        if: runner.os != 'Windows'
        run: |
          zsh --version
          fish --version || true

      - name: Install Rust toolchain
        id: rust
        run: |
          # Uses rust-toolchain.toml if the repository has one, otherwise stable.
          if [[ -f rust-toolchain.toml || -f rust-toolchain ]]; then
            rustup show active-toolchain || rustup toolchain install
          else
            rustup toolchain install stable --profile minimal
            rustup default stable
          fi
          rustup component add clippy rustfmt
          rustc --version
          echo "rustc=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-test-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        working-directory: ui
        run: npm ci

      - name: npm run lint
        working-directory: ui
        run: npm run lint

      - name: npm test
        working-directory: ui
        run: npm test

      # The Tauri crate embeds ui/dist at compile time, so the UI must be built
      # before clippy and cargo test compile it.
      - name: Build UI
        working-directory: ui
        run: npm run build

      # The e2e build swaps the WebGL addon for a stub; it must never ship.
      - name: Release UI has no e2e-only code
        working-directory: ui
        run: npm run check:release

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # A shell listed here that is missing fails the shell integration tests
      # instead of skipping them silently: zsh and fish on macOS and Linux.
      - name: cargo test
        env:
          TERMBAY_REQUIRE_SHELLS: ${{ runner.os != 'Windows' && 'zsh,fish' || '' }}
        run: cargo test --workspace --locked

      # F2: pty throughput with and without flow control, bytes in flight.
      # Fails only on a large regression; the table goes to the job summary.
      - name: Flow control load
        if: runner.os != 'Windows'
        env:
          TERMBAY_FLOW_SECONDS: "2"
        run: cargo test -p termbay-core --test flow_load --locked -- --ignored --nocapture

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    env:
      TERMBAY_E2E_CONFIG: ${{ github.workspace }}/e2e-config.toml
      TERMBAY_CONFIG: ${{ github.workspace }}/e2e-config.toml
      # Startup log of the e2e app (command line, WebView2 variables,
      # panics), printed when the job fails.
      TERMBAY_E2E_LOG: ${{ github.workspace }}/e2e-app.log
    steps:
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # webkit2gtk-driver provides WebKitWebDriver, used by tauri-driver.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb zsh fish vim-tiny
          # No zsh-newuser-install prompt when zsh becomes the login shell (P8).
          touch ~/.zshrc
          # Same as in the test job: otherwise compinit asks about insecure
          # directories and eats the first keys the e2e tests type.
          insecure=$(zsh -fc 'autoload -Uz compaudit; compaudit' 2>/dev/null || true)
          if [ -n "$insecure" ]; then
            printf '%s\n' "$insecure" | xargs -d '\n' sudo chmod g-w,o-w
          fi
          zsh -fc 'autoload -Uz compaudit; compaudit'

      - name: Install Rust toolchain
        id: rust
        run: |
          if [[ -f rust-toolchain.toml || -f rust-toolchain ]]; then
            rustup show active-toolchain || rustup toolchain install
          else
            rustup toolchain install stable --profile minimal
            rustup default stable
          fi
          echo "rustc=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/tauri-driver*
            target/
          key: cargo-e2e-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-e2e-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-

      # tauri-driver: MIT OR Apache-2.0, only on the CI runner.
      - name: Install tauri-driver
        run: command -v tauri-driver || cargo install tauri-driver --locked

      # msedgedriver must match the WebView2 runtime version exactly.
      - name: Download msedgedriver for the installed WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
          if (-not $version) {
            $version = (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          }
          Write-Output "WebView2 $version"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath "$env:RUNNER_TEMP\edgedriver"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        working-directory: ui
        run: npm ci

      # DOM renderer build (ui/vite.e2e.config.ts), embedded by a debug app
      # built by the Tauri CLI (which serves the embedded assets, not devUrl).
      - name: Build the e2e app
        run: |
          (cd ui && npm run build:e2e)
          ui/node_modules/.bin/tauri build --ci --debug --no-bundle --features e2e
          # Run from a pane by the office spec (task B1).
          cargo build --locked -p termbay-hook

      - name: e2e (milestone 1, tabs, splits, flow control)
        run: |
          app="$PWD/target/debug/termbay"
          driver_args=()
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            app="$(cygpath -w "$PWD/target/debug/termbay.exe")"
            driver_args=(--native-driver "$(cygpath -w "$RUNNER_TEMP/edgedriver/msedgedriver.exe")")
          else
            Xvfb :99 -screen 0 1280x800x24 &
            export DISPLAY=:99
          fi
          export TERMBAY_E2E_APP="$app"
          hook="$PWD/target/debug/termbay-hook"
          [[ "$RUNNER_OS" == "Windows" ]] && hook="$(cygpath -w "$PWD/target/debug/termbay-hook.exe")"
          export TERMBAY_E2E_HOOK="$hook"
          tauri-driver "${driver_args[@]}" &
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # msedgedriver deletes its user data folders (where WebView2
            # should write DevToolsActivePort) when a session fails, so
            # snapshot them, their logs and the process owners while the
            # tests run. Printed by "e2e diagnostics".
            mkdir -p "$RUNNER_TEMP/webview2-watch"
            cat > "$RUNNER_TEMP/webview2-watch.ps1" <<'PS'
          $out = Join-Path $env:RUNNER_TEMP 'webview2-watch'
          for ($i = 0; $i -lt 120; $i++) {
            $log = Join-Path $out 'snapshots.txt'
            "=== $(Get-Date -Format o)" | Add-Content $log
            Get-CimInstance Win32_Process |
              Where-Object { $_.Name -match 'termbay|msedge' } |
              ForEach-Object {
                $owner = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
                "$($_.ProcessId) $($_.Name) owner=$($owner.Domain)\$($owner.User) session=$($_.SessionId) $($_.CommandLine)"
              } | Add-Content $log
            foreach ($root in @("$env:SystemRoot\SystemTemp", $env:TEMP)) {
              Get-ChildItem $root -Directory -Filter 'scoped_dir*' -ErrorAction SilentlyContinue | ForEach-Object {
                Get-ChildItem $_.FullName -Recurse -Depth 2 -ErrorAction SilentlyContinue |
                  ForEach-Object { $_.FullName } | Add-Content $log
                Get-ChildItem $_.FullName -Recurse -Include 'DevToolsActivePort','*.log' -ErrorAction SilentlyContinue |
                  ForEach-Object { Copy-Item $_.FullName (Join-Path $out ($_.Directory.Name + '-' + $_.Name)) -ErrorAction SilentlyContinue }
              }
            }
            Start-Sleep -Seconds 5
          }
          PS
            pwsh -NoProfile -File "$(cygpath -w "$RUNNER_TEMP/webview2-watch.ps1")" &
            whoami
          fi
          sleep 3
          cd ui && npm run e2e

      # Why a WebDriver session failed: the driver does not forward the
      # app's stderr, so show the app's own log and the WebView2 data
      # directories (DevToolsActivePort is written there).
      - name: e2e diagnostics
        if: failure()
        shell: bash
        run: |
          echo "--- e2e app log"
          cat "$TERMBAY_E2E_LOG" 2>/dev/null || echo "(no log: the app never started)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "--- app data directory"
            ls -laR "$LOCALAPPDATA/io.github.termbay.termbay" 2>/dev/null | head -50 || true
            echo "--- WebView2 snapshots taken during the tests"
            head -c 200000 "$RUNNER_TEMP/webview2-watch/snapshots.txt" 2>/dev/null || echo "(none)"
            for f in "$RUNNER_TEMP"/webview2-watch/*; do
              [[ "$f" == */snapshots.txt ]] && continue
              echo "--- $f"
              tail -n 80 "$f" || true
            done
          fi

      # P8: autocomplete in the whole app, with zsh and with fish as the login shell.
      - name: e2e autocomplete (zsh and fish)
        if: runner.os == 'Linux'
        run: |
          pkill -x tauri-driver || true
          pkill -x Xvfb || true
          sleep 1
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99 TERMBAY_E2E_APP="$PWD/target/debug/termbay"
          tauri-driver &
          sleep 3
          cd ui
          for shell in zsh fish; do
            sudo chsh -s "$(command -v "$shell")" "$USER"
            TERMBAY_E2E_SHELL="$shell" node --test --test-concurrency=1 e2e/specs/autocomplete.test.mjs
          done

  bundle:
    name: bundle and size (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Packages from decision D9 (no AppImage: it embeds WebKitGTK and goes over 20 MB).
          - os: macos-latest
            bundles: app,dmg
            binary: target/release/termbay
            hook: target/release/termbay-hook
          - os: ubuntu-22.04
            bundles: deb,rpm
            binary: target/release/termbay
            hook: target/release/termbay-hook
          - os: windows-latest
            bundles: nsis
            binary: target/release/termbay.exe
            hook: target/release/termbay-hook.exe
    steps:
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies (Tauri 2, webkit2gtk-4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        id: rust
        run: |
          if [[ -f rust-toolchain.toml || -f rust-toolchain ]]; then
            rustup show active-toolchain || rustup toolchain install
          else
            rustup toolchain install stable --profile minimal
            rustup default stable
          fi
          rustc --version
          echo "rustc=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-release-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm ci
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      # The e2e build swaps the WebGL addon for a stub; it must never ship.
      - name: Release UI has no e2e-only code
        working-directory: ui
        run: npm run check:release

      # Unsigned packages, only to measure and test (signing comes later).
      # Run from the repository root: the Tauri CLI finds app/src-tauri/tauri.conf.json.
      - name: tauri build
        run: ui/node_modules/.bin/tauri build --ci --bundles "${{ matrix.bundles }}"

      - name: Check artifact sizes
        run: |
          shopt -s nullglob
          artifacts=("${{ matrix.binary }}")
          case "${{ runner.os }}" in
            macOS)   artifacts+=(target/release/bundle/macos/*.app target/release/bundle/dmg/*.dmg) ;;
            Linux)   artifacts+=(target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm) ;;
            Windows) artifacts+=(target/release/bundle/nsis/*-setup.exe) ;;
          esac
          expected=$(( $(tr ',' '\n' <<<"${{ matrix.bundles }}" | wc -l) + 1 ))
          if [[ ${#artifacts[@]} -lt $expected ]]; then
            echo "error: expected $expected artifacts, found ${#artifacts[@]}: ${artifacts[*]}" >&2
            ls -R target/release/bundle >&2 || true
            exit 2
          fi
          bash scripts/check-size.sh --title "Sizes on ${{ runner.os }}" "${artifacts[@]}"

      # Claude Code spawns `termbay hook` once per event (F1 in docs/FASE2-PLANO.md).
      # Report only until the numbers decide between this binary and a small
      # separate hook binary; then a budget goes here.
      - name: Measure startup time
        run: node scripts/measure-startup.mjs "${{ matrix.binary }}" --runs 50 --title "Startup on ${{ runner.os }}"

      # The hook's own binary (decision E11): small, without Tauri, and
      # quick to start, since PreToolUse holds every tool call until it exits.
      - name: Build termbay-hook
        run: cargo build --release --locked -p termbay-hook

      - name: termbay-hook size and startup time
        run: |
          bash scripts/check-size.sh --title "termbay-hook on ${{ runner.os }}" "${{ matrix.hook }}"
          node scripts/measure-startup.mjs "${{ matrix.hook }}" --runs 50 --budget-ms 10 \
            --title "termbay-hook startup on ${{ runner.os }}" -- PreToolUse

  licenses:
    name: licenses
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo deny check licenses bans sources
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check
          command-arguments: licenses bans sources

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: test npm license checker
        run: node --test "scripts/*.test.mjs"

      - name: npm ci
        working-directory: ui
        run: npm ci

      # Script defined by the license check (D10, task T5) in ui/package.json.
      - name: npm run licenses
        working-directory: ui
        run: npm run licenses

  # Kept apart from the license job so a newly published advisory does not
  # turn unrelated pull requests red without being visible as its own check.
  advisories:
    name: advisories
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo deny check advisories
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check
          command-arguments: advisories
