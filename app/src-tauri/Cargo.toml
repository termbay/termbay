[package]
name = "termbay"
description = "termbay desktop app: a lightweight terminal with a 2D office for Claude agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
default-run = "termbay"

[[bin]]
name = "termbay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
termbay-core.workspace = true
tauri = { version = "2.12", features = [] }
# Already used by Tauri; listed only for `#[derive(Serialize)]` of event payloads.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# `tauri::test`: mock runtime for the command tests. Adds no crate.
tauri = { version = "2.12", features = ["test"] }
serde_json = "1"

# Lets `termbay --version` (and later `termbay hook`) print to the console
# it was started from, even though release builds use the GUI subsystem.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
# Turn off WebView2's browser keys (F5, Ctrl+R...). Same versions Tauri
# already links on Windows, so nothing new in the binary; MIT (OR Apache-2.0).
webview2-com = "0.39"
windows = { version = "0.62", default-features = false }

[features]
# e2e builds only: started by msedgedriver (which adds browser options
# to the command line), unknown command line options open
# the app instead of failing. Never enabled in release builds.
e2e = []

[lints]
workspace = true
