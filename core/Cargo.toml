[package]
name = "termbay-core"
description = "Core library of termbay: pty sessions and CLI parsing, without any UI dependency"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
portable-pty = "0.9"
# Fast search for ESC in the pty output (shell integration scanner). Already
# linked into the app through Tauri; MIT OR Unlicense.
memchr = "2"
# Minimal reading of `~/.termbay/config.toml` (the `[autocomplete]` section,
# until T14). Both are already in the app through Tauri; MIT OR Apache-2.0.
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# Office events (phase 2): hook payloads are JSON, and the event server's
# session token comes from the system's randomness. Both are already in the
# app through Tauri; MIT OR Apache-2.0.
# `preserve_order` keeps the key order of the user's Claude Code settings when
# `termbay hooks install` writes them back (indexmap is already in the tree).
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = "0.3"

# SIGKILL when a shell ignores SIGHUP, and process info for `pty_info`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Lists the children of the shell for `pty_info` (busy / foreground) and
# lets shells inherit Ctrl+C handling. Same crate and version as the app's;
# MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp"] }

[lints]
workspace = true
